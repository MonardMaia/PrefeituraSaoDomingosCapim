<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Demanda de Atendimento</title>
    <link rel="stylesheet" href="/Tela_Atendimento_Visitantes/Tela_Atendimento_Visitantes.css">
</head>

<body>
<div class="topo">
    <img src="../Imagens/LogoPrefeituraSemFundo.png" class="logo">
</div>
<div>
    <h2 class="titulo">Demanda de Atendimento</h2>
</div>
    <div class="container">
        <div class="box">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label>CPF:</label>
                <input type="text" id="cpf" required>
            </div>

            <div class="form-group">
                <label>Contato:</label>
                <input type="text" id="contato" placeholder="(xx) xxxxx-xxxx" maxlength="15" required>
            </div>

            <div class="form-group">
                <label>Região:</label>
                <input type="text" id="regiao" required>
            </div>

            <div class="form-group">
                <label>Data de Nascimento:</label>
                <input type="date" id="nascimento" required>
            </div>

            <div class="form-group">
                <label>Data do atendimento:</label>
                <input type="date" id="atendimento" required>
            </div>

            <div class="form-group">
                <label>Departamento:</label>
                <select id="departamento">
                    <option value="Gabinete do Prefeito">1 - Gabinete do Prefeito</option>
                    <option value="Planejamento">2 - Planejamento</option>
                    <option value="Recursos Humanos">3 - Recursos Humanos</option>
                    <option value="Contabilidade">4 - Contabilidade</option>
                    <option value="CPC">5 - CPC</option>
                    <option value="Administração">6 - Administração</option>
                    <option value="Controladoria">7 - Controladoria</option>
                    <option value="Ti">8 - Ti</option>
                </select>
            </div>

            <div class="form-group">
                <label>Assunto:</label>
                <input type="text" id="assunto" required>
            </div>

            <div class="botoes">
                <button onclick="voltar()">Voltar</button>
                <button onclick="avancar()">Avançar</button>
            </div>
            <div class="erro" id="erro"></div>
        </div>
    </div>
    <script src="/Tela_Atendimento_Visitantes/Tela_Atendimento_Visitantes.js"></script>
</body>
<footer>
    <div class="rodape">
        <img src="../Imagens/Rodape.jpeg">
    </div>
</footer>
</html>
