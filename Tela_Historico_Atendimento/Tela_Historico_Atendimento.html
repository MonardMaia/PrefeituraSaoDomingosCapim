<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Histórico de Atendimentos</title>
    <link rel="stylesheet" href="Tela_Historico_Atendimento.css">
</head>

<body>
 <div class="topo">
    <img src="../Imagens/LogoPrefeituraSemFundo.png" class="logo">
</div>
<div>
    <h2 class="titulo">Histórico de Atendimentos</h2>
</div>
    <div class="container">
        <div class="box">
            <!-- 🔍 BUSCA -->
            <div class="busca">
                <input type="text" id="buscar" placeholder="Buscar por Nome, CPF ..." onkeyup="filtrar()">
            </div>
            <!-- 📊 TABELA -->
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Contato</th>
                        <th>Região</th>
                        <th>Departamento</th>
                        <th>Assunto</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
            <button onclick="voltar()">Voltar</button>
        </div>
    </div>

    <script src="Tela_Historico_Atendimento.js"></script>

</body>
<footer>
    <div class="rodape">
        <img src="../Imagens/Rodape.jpeg">
    </div>

</html>
