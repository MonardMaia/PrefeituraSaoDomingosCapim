<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Confirmar Atendimento</title>
    <link rel="stylesheet" href="Tela_Salvar_Edicao_Atendimento.css">
</head>

<body>
    <div class="topo">
        <img src="../Imagens/LogoPrefeituraSemFundo.png" class="logo">
    </div>
    <div>
        <h2 class="titulo">Confirmar Atendimento</h2>
    </div>
    <div class="container">
        <div class="box">
            <div class="linha">
                <label>Nome Completo:</label>
                <span id="nome"></span>
            </div>
            <div class="linha">
                <label>CPF:</label>
                <span id="cpf"></span>
            </div>
            <div class="linha">
                <label>Contato:</label>
                <span id="contato"></span>
            </div>
            <div class="linha">
                <label>Região:</label>
                <span id="regiao"></span>
            </div>

            <div class="linha">
                <label>Data de Nascimento:</label>
                <span id="nascimento"></span>
            </div>
            <div class="linha">
                <label>Data do Atendimento:</label>
                <span id="atendimento"></span>
            </div>
            <div class="linha">
                <label>Assunto:</label>
                <span id="assunto"></span>
            </div>
            <div class="linha">
                <label>Departamento:</label>
                <span id="departamento"></span>
            </div>
            <div class="botoes">
                <button onclick="editar()">Editar</button>
                <button onclick="salvar()">Salvar</button>
            </div>
        </div>
    </div>
    <script src="Tela_Salvar_Edicao_Atendimento.js"></script>
</body>
<footer>
    <div class="rodape">
        <img src="../Imagens/Rodape.jpeg">
    </div>
</footer>

</html>
