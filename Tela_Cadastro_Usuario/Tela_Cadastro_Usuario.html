<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="/Tela_Cadastro_Usuario/Tela_Cadastro_Usuario.css">
</head>

<body>
    <div class="topo">
    <img src="../Imagens/LogoPrefeituraSemFundo.png" class="logo">
</div>
<div>
    <h2 class="titulo">Cadastro de Usuário</h2>
</div>
    <div class="container">
        <div class="box">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label>CPF:</label>
                <input type="text" id="cpf" required>
            </div>

            <div class="form-group">
                <label>Contato:</label>
                <input type="text" id="contato" placeholder="(xx) xxxxx-xxxx" maxlength="15" required>
            </div>

            <div class="form-group">
                <label>Departamento:</label>
                <select id="departamento">
                    <option value="Planejamento">1 - Planejamento</option>
                    <option value="Recursos Humanos">2 - Recursos Humanos</option>
                    <option value="Contabilidade">3 - Contabilidade</option>
                    <option value="CPC">4 - CPC</option>
                    <option value="Administração">5 - Administração</option>
                    <option value="Controladoria">6 - Controladoria</option>
                    <option value="Ti">7 - TI</option>
                </select>
            </div>

            <div class="form-group">
                <label>Perfil:</label>
                <select id="perfil">
                    <option value="user">Usuário</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label>E-mail:</label>
                <input type="text" id="email" placeholder="Digite E-mail" required>
            </div>

            <div class="form-group">
                <label>Senha:</label>
                <input type="password" id="senha" required>
            </div>

            <div class="form-group">
                <label>Confirmar Senha:</label>
                <input type="password" id="confirmacaoSenha" required>
            </div>
            <div class="botoes">
                <button onclick="voltar()">Voltar</button>
                <button onclick="salvar()">Salvar</button>
            </div>
            <div class="erro" id="erro"></div>
        </div>
    </div>
    <script src="/Tela_Cadastro_Usuario/Tela_Cadastro_Usuario.js"></script>
</body>
<footer>
    <div class="rodape">
        <img src="../Imagens/Rodape.jpeg">
    </div>
</footer>

</html>
