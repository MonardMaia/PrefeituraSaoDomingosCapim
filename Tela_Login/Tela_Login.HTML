<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - Prefeitura</title>
    <link rel="stylesheet" href="/Tela_Login/Tela_Login.css">
</head>

<body>

    <div class="faixa-topo"></div>

    <div class="topo">
        <img src="../Imagens/LogoPrefeituraSemFundo.png">
    </div>

    <div class="container">
        <div class="box">

            <input type="text" placeholder="Login do Usuário" id="usuario">
            <input type="password" placeholder="Senha do Usuário" id="senha">

            <div class="links">
                <a href="#" onclick="mostrarMensagem(event, 'senha')">Esqueci minha senha</a>
                <a href="#" onclick="mostrarMensagem(event, 'cadastro')">Solicitar cadastro</a>
            </div>
            <button onclick="acessar()">Acessar</button>
        </div>
    </div>
     <div id="alerta" class="alerta-style"></div>

<footer>
    <div class="rodape">
        <img src="../Imagens/Rodape.jpeg">
    </div>
</footer>
<script src="/Tela_Login/Tela_Login.js"></script>
</body>

</html>
